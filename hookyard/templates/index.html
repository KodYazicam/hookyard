<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hookyard</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <h1>hookyard</h1>
      <p>Local webhook inspector · KodYazicam</p>
    </div>
    <div class="row">
      <input id="bin" value="demo" spellcheck="false">
      <button id="create">Open bin</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
  </header>
  <main>
    <aside>
      <p class="hint">POST to <code id="url"></code></p>
      <div class="filters">
        <input id="search" type="search" placeholder="Search path, body, headers" spellcheck="false" aria-label="Search requests">
        <select id="method" aria-label="Filter by HTTP method">
          <option value="">All methods</option>
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>PATCH</option>
          <option>DELETE</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
      </div>
      <p id="empty" class="empty" hidden></p>
      <ul id="list"></ul>
    </aside>
    <section id="detail">
      <p class="empty">Waiting for webhooks…</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
