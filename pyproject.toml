[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookyard"
version = "1.0.0"
description = "Local webhook inspector. Catch, inspect, verify, and replay HTTP callbacks."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Batuhan (KodYazicam)", email = "kodyazicam@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["webhook", "http", "fastapi", "stripe", "github", "discord", "debug", "mcp", "model-context-protocol", "ai-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "mcp>=2.0", "build>=1.2"]
discord = ["pynacl>=1.5"]
mcp = ["mcp>=2.0"]

[project.scripts]
hookyard = "hookyard.cli:main"
hookyard-mcp = "hookyard.mcp:main"

[project.urls]
Homepage = "https://github.com/KodYazicam/hookyard"
Source = "https://github.com/KodYazicam/hookyard"
Changelog = "https://github.com/KodYazicam/hookyard/blob/main/CHANGELOG.md"
Issues = "https://github.com/KodYazicam/hookyard/issues"

[tool.setuptools.packages.find]
include = ["hookyard*"]

[tool.setuptools.package-data]
hookyard = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
